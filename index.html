<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Number Generator</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <h1>Lotto Number Generator</h1>
    <div class="controls">
      <div class="theme-switch-wrapper">
        <span>Light Mode</span>
        <label class="theme-switch" for="checkbox">
          <input type="checkbox" id="checkbox" />
          <div class="slider round"></div>
        </label>
        <span>Dark Mode</span>
      </div>
      <label for="numSets">Number of Sets:</label>
      <input type="number" id="numSets" value="1" min="1" max="5">
      <button id="generateBtn">Generate Numbers</button>
    </div>
    <lotto-generator id="lottoGenerator"></lotto-generator>

    <section class="contact-form-section">
        <h2>제휴 문의</h2>
        <form action="YOUR_FORMSPREE_ENDPOINT_URL" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">이메일:</label>
                <input type="email" id="email" name="_replyto" required>
            </div>
            <div class="form-group">
                <label for="message">문의 내용:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">문의하기</button>
        </form>
        <p class="formspree-notice">
            <a href="https://formspree.io/" target="_blank" rel="noopener noreferrer">Formspree</a>를 통해 안전하게 문의를 받습니다.
            **주의: 실제 사용 전 `YOUR_FORMSPREE_ENDPOINT_URL`을 본인의 Formspree 폼 URL로 교체해야 합니다.**
        </p>
    </section>

  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
